# /etc/nginx/sites-available/zt-webdav  (symlink into sites-enabled/)
# WebDAV resource plane on 192.168.40.20, gated by the allowlist admin service.
# Two server blocks: :443 serves WebDAV (allowlisted via auth_request), :8444
# is the admin API the PEP calls (POST/DELETE /admin/allowlist). Both terminate
# TLS with the lab CA-signed cert and proxy to webdav_admin.py on :5001.

# --- WebDAV file plane, allowlist-gated ------------------------------------
server {
    listen 192.168.40.20:443 ssl;
    server_name 192.168.40.20;

    ssl_certificate     /etc/zt-webdav/certs/zt-webdav.crt;
    ssl_certificate_key /etc/zt-webdav/certs/zt-webdav.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/webdav;

    location / {
        # every WebDAV request is authorized by the allowlist service first
        auth_request /_authz;

        # nginx dav module (package: libnginx-mod-http-dav-ext)
        dav_methods     PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS;
        dav_access      user:rw group:rw all:r;
        create_full_put_path on;
        autoindex on;
    }

    # internal subrequest -> webdav_admin.py /authz; passes the real client IP
    location = /_authz {
        internal;
        proxy_pass              http://127.0.0.1:5001/authz;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-IP $remote_addr;
    }
}

# --- admin API the PEP calls (issue/revoke allowlist entries) ---------------
server {
    listen 192.168.40.20:8444 ssl;
    server_name 192.168.40.20;

    ssl_certificate     /etc/zt-webdav/certs/zt-webdav.crt;
    ssl_certificate_key /etc/zt-webdav/certs/zt-webdav.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /admin/ {
        proxy_pass       http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Token $http_x_admin_token;
    }
}
