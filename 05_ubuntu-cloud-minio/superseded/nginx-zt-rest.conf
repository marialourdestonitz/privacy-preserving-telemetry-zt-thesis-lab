# /etc/nginx/sites-available/zt-rest  (symlink into sites-enabled/)
# TLS front for the cloud REST resource server on 192.168.40.10:443.
# Terminates TLS with the lab CA-signed cert and proxies to Flask on :5000,
# so the PEP reaches https://192.168.40.10:443/admin/issue|revoke and clients
# reach https://192.168.40.10:443/files/<name> exactly as configured.

server {
    listen 192.168.40.10:443 ssl;
    server_name 192.168.40.10;

    # Issue this cert from the lab CA (setup_certs.sh style):
    #   openssl req/x509 with CN=zt-cloud, SAN IP:192.168.40.10, signed by ca.crt
    ssl_certificate     /etc/zt-cloud/certs/zt-cloud.crt;
    ssl_certificate_key /etc/zt-cloud/certs/zt-cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization $http_authorization;
    }
}
